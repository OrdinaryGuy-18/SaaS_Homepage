<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950">
  <section class="py-24 px-6">
    <h3 class="text-4xl font-bold text-center">Pricing</h3>
    <div class="max-w-7xl mx-auto grid md:grid-cols-3 gap-8 mt-16">
      <div class="bg-gray-900 p-8 rounded-xl border border-gray-800">
        <h4 class="text-xl font-semibold">Starter</h4>
        <p class="text-4xl font-bold mt-4">₹0</p>
        <button class="mt-8 w-full border border-gray-700 py-3 rounded-lg">
          Get Started
        </button>
      </div>
      <div class="bg-indigo-600 p-8 rounded-xl text-white scale-105">
        <h4 class="text-xl font-semibold">Pro</h4>
        <p class="text-4xl font-bold mt-4">₹999</p>
        <button class="mt-8 w-full bg-white text-indigo-600 py-3 rounded-lg font-semibold">
          Choose Plan
        </button>
      </div>
      <div class="bg-gray-900 p-8 rounded-xl border border-gray-800">
        <h4 class="text-xl font-semibold">Enterprise</h4>
        <p class="text-4xl font-bold mt-4">Custom</p>
        <button class="mt-8 w-full border border-gray-700 py-3 rounded-lg">
          Contact Sales
        </button>
      </div>
    </div>
  </section>
</body>
</html>
